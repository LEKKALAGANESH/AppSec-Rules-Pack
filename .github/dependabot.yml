version: 2
updates:
  # Python runtime + dev dependencies (pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions: refresh SHA pins through reviewable pull requests.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # `github/codeql-action` ships init, autobuild, analyze and upload-sarif from one
      # release, and CodeQL requires init and analyze to come from the SAME version.
      # Ungrouped, Dependabot raises one pull request per sub-action, and a partial
      # merge leaves the workflow mixing versions. That very nearly happened here:
      # three sub-action bumps to v4.37.6 were open at once (#14, #15, #16) with no
      # matching pull request for init. Grouping is what keeps the pins consistent by
      # construction rather than by whoever reviews the queue noticing in time.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
